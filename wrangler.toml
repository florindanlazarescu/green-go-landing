name = "production-worker"
main = "src/worker.js"
compatibility_date = "2025-01-01"
account_id = "593378a2358be7e781872db66b7891dc"

# Static assets served from the repo root.
# run_worker_first = true is required: without it, wrangler v4 serves matching
# static files (e.g. index.html) directly from edge storage, bypassing the
# worker's fetch handler entirely — so the APP_BASE_URL replacement never runs.
[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true

# ── Production (main branch → npx wrangler deploy) ────────────────────────────
[vars]
APP_BASE_URL = "https://app.green-go.ro"
# Lansarea oficială. Până atunci, green-go.ro/ redirecționează temporar (302) către /lansare/.
# După această dată redirectul se oprește singur. Ora este a României (+02:00).
LAUNCH_AT = "2026-12-04T00:00:00+02:00"

# Use the existing D1 database without provisioning it from CI.
[[d1_databases]]
binding = "DB"
database_name = "greengo-launch-waitlist"
database_id = "8df61d50-c319-43e2-8e9c-c3b7a7c2938a"

[[routes]]
pattern = "green-go.ro/*"
zone_name = "green-go.ro"

[[routes]]
pattern = "www.green-go.ro/*"
zone_name = "green-go.ro"

# ── Staging (staging branch → npx wrangler deploy --env staging) ──────────────
[env.staging]
name = "production-worker-staging"

[env.staging.vars]
APP_BASE_URL = "https://delivery-staging.green-go.ro"
LAUNCH_AT = "2026-12-04T00:00:00+02:00"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "greengo-launch-waitlist-staging"

[[env.staging.routes]]
pattern = "staging.green-go.ro/*"
zone_name = "green-go.ro"

